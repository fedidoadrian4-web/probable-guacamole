name: RDP - Windows Performance

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Check Hardware
        shell: pwsh
        run: |
          Write-Host "=== HARDWARE DA VM ==="

          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores,
              NumberOfLogicalProcessors

          Get-CimInstance Win32_ComputerSystem |
            Select-Object TotalPhysicalMemory

          Get-CimInstance Win32_VideoController |
            Select-Object Name, DriverVersion,
              AdapterRAM

      - name: Configure Windows Performance
        shell: pwsh
        run: |
          # Plano de energia equilibrado
          powercfg /setactive SCHEME_BALANCED

          # Reduzir efeitos visuais
          Set-ItemProperty `
            -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' `
            -Name VisualFXSetting -Value 2

          # Manter NLA habilitado
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1

          # Firewall: permitir RDP
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Create RDP User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Configure o segredo RDP_PASSWORD no GitHub."
          }

          $securePass = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          if (-not (Get-LocalUser -Name "Skyro" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "Skyro" `
              -Password $securePass `
              -AccountNeverExpires
          } else {
            Set-LocalUser -Name "Skyro" -Password $securePass
          }

          Add-LocalGroupMember -Group "Remote Desktop Users" `
            -Member "Skyro" -ErrorAction SilentlyContinue

      - name: Install Tailscale
        shell: pwsh
        run: |
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $installer

          Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$installer`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installer -Force

      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "Configure TAILSCALE_AUTH_KEY nos secrets."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up --authkey=$env:TS_AUTHKEY `
            --hostname="gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Falha na conexão Tailscale."
          }

          $ip = & $ts ip -4

          if (-not $ip) {
            throw "IP do Tailscale não encontrado."
          }

          "TAILSCALE_IP=$ip" |
            Out-File $env:GITHUB_ENV -Append

      - name: Show Connection Information
        shell: pwsh
        run: |
          Write-Host "=== VM CONECTADA ==="
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host "Usuário: Skyro"
          Write-Host "Senha: configurada no GitHub Secrets"
          Write-Host "===================="

      - name: Keep Runner Alive
        shell: pwsh
        run: |
          while ($true) {
            Write-Host "VM ativa: $(Get-Date)"
            Start-Sleep -Seconds 300
          }

